# Original action got from https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml

name: Scorecards security analysis
on:
  push:
    branches: [ "release/v*" ]
  pull_request:
    branches: [ "release/v*" ]
    types: [opened, synchronize]
  workflow_dispatch:
  schedule:
    # Weekly on Saturdays.
    - cron:  '30 1 * * 6'

# Declare default permissions as read only.
permissions: read-all

jobs:
  scorecards-analysis:
    name: Scorecards analysis
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          # Scorecard team runs a weekly scan of public GitHub repos,
          # see https://github.com/ossf/scorecard#public-data.
          # Setting `publish_results: true` helps us scale by leveraging your workflow to
          # extract the results instead of relying on our own infrastructure to run scans.
          # And it's free for you!
          publish_results: false

      - name: "Filter analysis results to enabled checks"
        env:
          SCORECARD_ENABLED_CHECKS: TokenPermissionsID,PinnedDependenciesID
        run: |
          ENABLED_CHECKS_IN_JSON=$(echo $SCORECARD_ENABLED_CHECKS | jq -cR 'split(",")')
          
          # Filter SARIF File and only keep enabled checks
          cat results.sarif | jq '.runs[].results |= map(select(.ruleId as $id | '$ENABLED_CHECKS_IN_JSON' | index($id)))' > filteredResults.sarif

      # Upload the results to GitHub's code scanning dashboard (optional).
      # Commenting out will disable upload of results to your repo's Code Scanning dashboard
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@39edc492dbe16b1465b0cafca41432d857bdb31a # v3.29.1
        with:
          sarif_file: results.sarif
          category: scorecard